<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tulip Fashion | Online Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff8fb;color:#333}
header{background:#a83268;color:white;padding:22px 15px;text-align:center}
header h1{margin:0;font-size:30px}
header p{margin:7px 0 0}
.hero{text-align:center;padding:25px 12px;background:#f9dce9}
.hero h2{color:#8b2455}
.products{padding:15px;display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.card{background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.card img{width:100%;height:190px;object-fit:cover;background:#eee}
.info{padding:10px}
.info h3{font-size:16px;margin:4px 0}
.price{color:#a83268;font-weight:bold;font-size:18px}
button{background:#a83268;color:white;border:0;padding:10px;border-radius:6px;width:100%;margin-top:8px}
footer{text-align:center;padding:20px;background:#a83268;color:white}
#status{text-align:center;padding:15px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header>
<h1>Tulip Fashion</h1>
<p>Fashion for Everyone</p>
</header>

<section class="hero">
<h2>Welcome to Tulip Fashion</h2>
<p>আপনার পছন্দের পোশাক এখন অনলাইনে!</p>
</section>

<h2 style="text-align:center">Our Products</h2>
<div id="status">পণ্য লোড হচ্ছে...</div>
<div class="products" id="products"></div>

<footer>
<p>Tulip Fashion</p>
<p>Arpara Bazar, Santipur, Nadia, West Bengal - 741404</p>
<p>WhatsApp: 7001841267</p>
</footer>

<script>
const SUPABASE_URL = "https://iklpbcqkrxbyxycgnzcc.supabase.co";
const SUPABASE_KEY = "sb_publishable_rBItI7r0Md0igFr5U5UAYw_EHpbisyX";

async function loadProducts(){
 const status=document.getElementById("status");
 const list=document.getElementById("products");

 try{
  const response=await fetch(
   SUPABASE_URL+"/rest/v1/products?select=*&published=eq.true&order=created_at.desc",
   {headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY
   }}
  );

  if(!response.ok) {
  throw new Error("HTTP "+response.status+": "+await response.text());
}

  const products=await response.json();
  status.textContent=products.length ? "" : "এখনও কোনো পণ্য যোগ করা হয়নি।";

  products.forEach(p=>{
   const image=p.image_urls && p.image_urls.length ? p.image_urls[0] : "";
   const card=document.createElement("div");
   card.className="card";
   card.innerHTML=`
    <img src="${image}" alt="Product">
    <div class="info">
     <h3></h3>
     <p class="price">₹${Number(p.price).toFixed(2)}</p>
     <p>স্টক: ${p.stock}</p>
     <button>WhatsApp-এ অর্ডার করুন</button>
    </div>`;
   card.querySelector("h3").textContent=p.name;
   card.querySelector("button").onclick=()=>{
    const message=encodeURIComponent("আমি "+p.name+" অর্ডার করতে চাই।");
    window.open("https://wa.me/917001841267?text="+message,"_blank");
   };
   list.appendChild(card);
  });
 }catch(error){
  status.textContent="Error: "+error.message;
  console.error(error);
}
}
loadProducts();
</script>

</body>
</html>
